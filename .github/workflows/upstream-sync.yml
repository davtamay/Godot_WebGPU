# Fork-local workflow for the WebGPU patch stack; not intended for upstream.
#
# Weekly upstream auto-rebase: fetches godotengine/godot master, replays the
# patch stack onto it, and - only when every patch applies cleanly and
# check-stack passes - pushes the result to a dated auto-rebase/ candidate
# branch (plus a backup tag of the pre-rebase head). The baseline workflow
# then builds the candidate. webgpu-stack itself is NEVER pushed by
# automation: promotion stays a human step because CI cannot run the
# local-only gates (tint bakes, strict pixel probe on a real GPU, in-headset
# checks). Run misc/webgpu_scripts/promote-candidate.sh to promote.
#
# A faithful replay carries upstream's own .github/workflows/ updates, and the
# token GitHub hands to a workflow run is never allowed to push those. Pushing
# candidates therefore needs a repository secret SYNC_PAT: a fine-grained
# personal access token for this repository with Contents and Workflows set to
# read and write.
#
# The run's verdict is the REPLAY, not the push: a clean rebase that cannot
# publish its candidate warns and stays green, because the question this
# workflow answers - do the patches still apply to upstream master? - has been
# answered either way, and the replay reproduces locally byte for byte. Without
# SYNC_PAT the only thing lost is the convenience branch (and the baseline
# build of it) on weeks when upstream touched a workflow file.
#
# Resilience measures:
# - A conflicted rebase or failed verification opens/updates a FAILED issue
#   (label: upstream-sync) naming the cause: the conflicting patch and files,
#   or the commits whose subjects break the [wgpu NN] convention. A fresh
#   candidate opens/updates a separate "candidate ready" issue with the
#   promotion checklist and closes any open FAILED issue. The two never
#   share an issue: a failure appended to good news reads as a footnote.
# - The baseline workflow runs the subject and check-stack gates on every
#   push, so a commit that would fail the next replay is reported at once.
# - This workflow never compiles anything, so a clean replay is not a build.
#   build-verdict.yml reports the candidate's baseline result in these same
#   issues, and only a green build closes a "does not build" issue.
# - A candidate left unpromoted for a week is called out in the next run's
#   report, in the issue title and at the top of the comment. The human
#   side of all of this is docs/webgpu-sync-protocol.md.
# - GH_REPO pins every gh call to this fork. Once the upstream remote exists,
#   gh's own remote ranking prefers a remote named "upstream", so unpinned
#   calls resolve to godotengine/godot - which is where the reporting steps
#   were looking for the label they could not find.
# - The tracking label is created idempotently every run, and reporting is
#   non-fatal: an informational report can never turn a clean rebase red
#   (a real rebase/verify failure still fails the run).
# - The workflow re-enables itself every run (GitHub disables schedules
#   after 60 days of repo inactivity).
# - SYNC_PAT is checked before it is used. Three weeks before it expires, or
#   as soon as it stops working, a dedicated issue says so and how to renew.
# - Old candidates/backup tags are pruned (newest 3 kept).
# - The Emscripten pin is diffed against upstream's web_builds.yml so pin
#   drift is flagged before it becomes a mysterious build failure.

name: WebGPU stack - upstream sync

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  rebase:
    name: Rebase stack onto upstream master
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The token is the one thing here with an expiry date. Left unchecked, a
      # dead one fails at checkout with an auth error that names nothing;
      # caught first, the replay still runs on the default token and the
      # report says what to renew.
      - name: Check the push token
        id: token
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          RENEW="Create a fine-grained token for this repository with Contents and Workflows set to read and write, then update the SYNC_PAT secret under Settings, Secrets and variables, Actions."
          STATE=dead
          NOTE="SYNC_PAT is not set, so candidates that carry upstream workflow changes cannot be pushed, and a candidate pushed without it starts no baseline build. $RENEW"
          if [ -n "$SYNC_PAT" ]; then
            HEADERS=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $SYNC_PAT" "https://api.github.com/repos/$GH_REPO" | tr -d '\r' || true)
            CODE=$(printf '%s\n' "$HEADERS" | awk 'NR==1 {print $2}')
            NOTE="SYNC_PAT was rejected (HTTP 401): it has expired or been revoked. This run falls back to the default token, which cannot push upstream workflow changes and starts no baseline build. $RENEW"
            # Only a 401 condemns the token. A network or API hiccup says
            # nothing about it, and a false alarm teaches people to ignore this.
            if [ "$CODE" != 401 ]; then
              STATE=ok
              NOTE=""
              EXPIRY=$(printf '%s\n' "$HEADERS" | sed -n 's/^github-authentication-token-expiration: //Ip')
              if [ -n "$EXPIRY" ]; then
                DAYS=$(( ($(date -d "$EXPIRY" +%s) - $(date +%s)) / 86400 ))
                echo "SYNC_PAT expires $EXPIRY ($DAYS days)."
                if [ "$DAYS" -le 21 ]; then
                  NOTE="SYNC_PAT expires on $EXPIRY, in $DAYS days. When it does, the sync cannot publish a candidate that carries upstream workflow changes, and no candidate gets a baseline build. $RENEW"
                fi
              else
                echo "SYNC_PAT check answered HTTP ${CODE:-none} with no expiry date."
              fi
            fi
          fi
          echo "SYNC_PAT state: $STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "note=$NOTE" >> "$GITHUB_OUTPUT"

      - name: Checkout stack
        uses: actions/checkout@v6
        with:
          ref: webgpu-stack
          fetch-depth: 0
          token: ${{ steps.token.outputs.state == 'ok' && secrets.SYNC_PAT || github.token }}

      - name: Keep the schedule alive
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/upstream-sync.yml/enable" || true

      - name: Ensure the tracking label exists
        run: |
          gh label create upstream-sync \
            --color 1d76db \
            --description "Automated upstream rebase status" \
            --force || echo "::warning::could not ensure the upstream-sync label; issue reporting may be skipped"

      - name: Report the push token
        continue-on-error: true
        env:
          NOTE: ${{ steps.token.outputs.note }}
        run: |
          TITLE="Upstream sync: SYNC_PAT needs renewing"
          NUM=$(gh issue list --label upstream-sync --state open --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null || echo "")
          if [ -z "$NOTE" ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "Resolved: SYNC_PAT is valid again." || true
            fi
            exit 0
          fi
          echo "::warning::$NOTE"
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --label upstream-sync --body "$NOTE" || echo "::warning::could not create the token issue"
          else
            gh issue comment "$NUM" --body "$NOTE" || echo "::warning::could not update the token issue"
          fi

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/godotengine/godot.git
          git fetch upstream master

      - name: Count new upstream commits
        id: fresh
        run: |
          BASE=$(git merge-base HEAD upstream/master)
          COUNT=$(git rev-list --count "$BASE"..upstream/master)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Upstream is $COUNT commit(s) ahead of the stack's base."

      - name: Check the Emscripten pin against upstream
        id: empin
        run: |
          UP=$(git show upstream/master:.github/workflows/web_builds.yml | grep -oE "EM_VERSION: *[0-9.]+" | grep -oE "[0-9.]+" | head -1 || true)
          OURS=$(grep -oE "EM_VERSION: *[0-9.]+" .github/workflows/web-baseline.yml | grep -oE "[0-9.]+" | head -1 || true)
          echo "upstream=$UP ours=$OURS"
          if [ -n "$UP" ] && [ -n "$OURS" ] && [ "$UP" != "$OURS" ]; then
            echo "drift=Emscripten pin drift: upstream web_builds.yml uses $UP, our baseline pins $OURS." >> "$GITHUB_OUTPUT"
          else
            echo "drift=" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase
        if: steps.fresh.outputs.count != '0'
        id: rebase
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync[bot]@users.noreply.github.com"
          STAMP=$(date -u +%Y%m%d)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          # -f because the tag name is dated, not per-run: a second run on the
          # same day (a re-run after a failure, which is exactly when this
          # matters) would otherwise die on "tag already exists". The tag
          # records the head this run rebased FROM, so moving it to the current
          # head is what recovery wants.
          git tag -f "backup/auto-$STAMP" HEAD
          if ! git rebase upstream/master; then
            PATCH=$(git log -1 --format=%s REBASE_HEAD 2>/dev/null || echo '(unknown patch)')
            FILES=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "::error::Rebase conflicted on: $PATCH (files: $FILES)"
            echo "cause=Patch '$PATCH' conflicted on: $FILES" >> "$GITHUB_OUTPUT"
            git rebase --abort || true
            exit 1
          fi

      # The same two checks run on every push in the baseline workflow's
      # check-stack job, so a commit that breaks them is reported within
      # minutes of landing rather than at the next scheduled replay.
      - name: Verify stack integrity
        if: steps.fresh.outputs.count != '0'
        id: verify
        run: |
          PATCHES=$(git log --oneline upstream/master..HEAD | wc -l)
          STRAYS=$(git log --format=%s upstream/master..HEAD | grep -v "^\[wgpu " || true)
          echo "Patches: $PATCHES"
          if [ -n "$STRAYS" ]; then
            echo "::error::commit(s) without a [wgpu NN] subject on the stack: $STRAYS"
            echo "cause=Commit(s) without a [wgpu NN] subject on webgpu-stack (reword or fold them before the next replay): $(echo "$STRAYS" | tr '\n' ';')" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! bash misc/webgpu_scripts/check-stack.sh; then
            echo "cause=check-stack.sh failed after a clean replay - see the run log for the offending patch and file." >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push candidate branch and backup tag
        id: candidate
        if: steps.fresh.outputs.count != '0'
        run: |
          STAMP=${{ steps.rebase.outputs.stamp }}
          git push --force origin "backup/auto-$STAMP" || echo "::warning::could not push the backup tag"
          if git push --force origin "HEAD:auto-rebase/$STAMP"; then
            echo "pushed=yes" >> "$GITHUB_OUTPUT"
            echo "Candidate: auto-rebase/$STAMP (baseline CI builds it next)."
          else
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::The replay is clean but the candidate branch could not be pushed. A rejection naming 'workflows permission' means upstream changed a file under .github/workflows/ and this run's default token may not push those - add the SYNC_PAT secret described in the workflow header to restore automatic candidates. Rebase locally in the meantime: the replay is deterministic and reproduces exactly."
          fi

      - name: Prune old candidates and backup tags (keep newest 3)
        if: steps.fresh.outputs.count != '0' && steps.candidate.outputs.pushed == 'yes'
        run: |
          git ls-remote --heads origin "auto-rebase/*" | awk '{print $2}' | sed 's|refs/heads/||' | sort | head -n -3 | while read -r b; do
            echo "pruning branch $b"; git push origin --delete "$b" || true
          done
          git ls-remote --tags origin "backup/auto-*" | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}' | sort | head -n -3 | while read -r t; do
            echo "pruning tag $t"; git push origin --delete "$t" || true
          done

      # Reporting is informational and must never fail the run: continue-on-error
      # keeps a clean rebase green even if the GitHub issue API hiccups, and the
      # guards keep the step itself green in the normal case.
      - name: Report candidate ready
        if: success() && steps.fresh.outputs.count != '0'
        continue-on-error: true
        run: |
          STAMP=${{ steps.rebase.outputs.stamp }}
          COUNT=${{ steps.fresh.outputs.count }}
          DRIFT="${{ steps.empin.outputs.drift }}"
          if [ "${{ steps.candidate.outputs.pushed }}" = "yes" ]; then
            L1="Candidate \`auto-rebase/$STAMP\` is pushed ($COUNT new upstream commits; clean replay, check-stack OK). The patches apply; nothing has compiled them yet. Baseline CI is building it and reports here when it finishes."
            L2="Once that is green, promote locally with \`bash misc/webgpu_scripts/promote-candidate.sh $STAMP\` and run the local gates (tint bake, strict probe, headset spot-check) before force-with-lease pushing."
          else
            L1="The stack replayed cleanly onto upstream ($COUNT new upstream commits, check-stack OK), but the candidate branch could not be pushed - see the run log for the rejection. Nothing is broken: the replay is deterministic and reproduces locally."
            L2="Rebase locally (\`git fetch upstream && git rebase upstream/master\`) and run the local gates. To restore automatic candidates, add the SYNC_PAT secret described in the workflow header."
          fi
          BODY=$(printf '%s\n\n%s\n\n%s' "$L1" "$L2" "$DRIFT")
          # Each outcome has its own issue: a failure is never appended to an
          # open "candidate ready" issue, where it reads as a footnote on
          # good news and goes unnoticed (two failures did, in October 2026).
          NUM=$(gh issue list --label upstream-sync --state open --json number,title --jq '[.[] | select(.title | startswith("Upstream sync: candidate ready"))] | .[0].number // empty' 2>/dev/null || echo "")
          # A candidate is useful for one week. When the open candidate-ready
          # issue is older than that, say so where it is read first (the title
          # and the top of the comment), so an unpromoted candidate stops being
          # a footnote under good news. See docs/webgpu-sync-protocol.md.
          if [ -n "$NUM" ]; then
            AGE=$(gh issue view "$NUM" --json createdAt --jq '((now - (.createdAt | fromdateiso8601)) / 86400) | floor' 2>/dev/null || echo 0)
            if [ "${AGE:-0}" -ge 7 ]; then
              STALE="**Unpromoted for $AGE days.** The previous candidate was never promoted and this one replaces it; every week of drift makes the next hand rebase larger. Promote this week."
              BODY=$(printf '%s\n\n%s' "$STALE" "$BODY")
              gh issue edit "$NUM" --title "Upstream sync: candidate ready (unpromoted for $AGE days)" || true
            fi
          fi
          if [ -z "$NUM" ]; then
            gh issue create --title "Upstream sync: candidate ready" --label upstream-sync --body "$BODY" || echo "::warning::could not create the tracking issue (rebase result is unaffected)"
          else
            gh issue comment "$NUM" --body "$BODY" || echo "::warning::could not update the tracking issue (rebase result is unaffected)"
          fi
          # A clean replay resolves a failed replay. It does not resolve a
          # candidate that did not build: only a green build can.
          for F in $(gh issue list --label upstream-sync --state open --json number,title --jq '.[] | select(.title | startswith("Upstream sync: FAILED - needs manual rebase")) | .number' 2>/dev/null); do
            gh issue close "$F" --comment "Resolved: the $STAMP replay is clean (see the candidate-ready issue)." || true
          done

      - name: Report failure
        if: failure()
        continue-on-error: true
        # The cause quotes commit subjects; it reaches the shell through the
        # environment, never through an inline expression, so it is text.
        env:
          CAUSE: ${{ steps.rebase.outputs.cause || steps.verify.outputs.cause || 'Cause not captured - see the run log.' }}
          DRIFT: ${{ steps.empin.outputs.drift }}
        run: |
          L1="The scheduled upstream rebase FAILED (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). The stack itself is untouched; resolve locally (backup tag was pushed if the rebase step ran)."
          BODY=$(printf '%s\n\n**Cause:** %s\n\n%s' "$L1" "$CAUSE" "$DRIFT")
          NUM=$(gh issue list --label upstream-sync --state open --json number,title --jq '[.[] | select(.title | startswith("Upstream sync: FAILED - needs manual rebase"))] | .[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$NUM" ]; then
            gh issue create --title "Upstream sync: FAILED - needs manual rebase" --label upstream-sync --body "$BODY" || echo "::warning::could not create the tracking issue"
          else
            gh issue comment "$NUM" --body "$BODY" || echo "::warning::could not update the tracking issue"
          fi
