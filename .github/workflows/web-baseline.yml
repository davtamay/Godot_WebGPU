# Fork-local workflow for the WebGPU patch stack; not intended for upstream.
# Stage 0.5 of the staged CI plan in docs/webgpu-testing.md.
# No driver exists yet: the stock leg is the size baseline, the rd leg
# builds with use_rendering_device=yes (RD stack linked in, dormant).
# Re-check the Emscripten pin against upstream .github/workflows/web_builds.yml on every upstream sync.

name: WebGPU stack - baseline

on:
  push:
    branches:
      - webgpu-stack
      - webgpu-dev
      - "auto-rebase/**"
  pull_request:
    branches:
      - webgpu-stack
  workflow_dispatch:

# SIZE CONTRACT: the web-template build flags below define the size baseline.
# Changing any of them invalidates all previously recorded WASM size deltas.
env:
  SCONS_CACHE: .scons_cache
  SCONS_FLAGS: >-
    dev_mode=yes
    debug_symbols=no
    use_closure_compiler=yes
  EM_VERSION: 6.0.1

jobs:
  web-template:
    name: web-template (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: stock
            extra_flags: ""
          - leg: rd
            extra_flags: webgpu=yes

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Restore SCons cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCONS_CACHE }}
          key: web-template-${{ matrix.leg }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            web-template-${{ matrix.leg }}-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons
          sudo apt-get update
          sudo apt-get install -y brotli

      - name: Build threaded web template (${{ matrix.leg }})
        run: |
          scons platform=web target=template_release ${{ env.SCONS_FLAGS }} threads=yes "cache_path=${{ env.SCONS_CACHE }}" redirect_build_objects=no ${{ matrix.extra_flags }}

      - name: Record WASM size
        run: |
          mkdir -p sizes
          bash misc/webgpu_scripts/wasm-size.sh bin sizes/wasm-sizes.txt
          {
            echo "### WASM sizes (${{ matrix.leg }})"
            echo
            echo '```'
            cat sizes/wasm-sizes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save SCons cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ env.SCONS_CACHE }}
          key: web-template-${{ matrix.leg }}-${{ runner.os }}-${{ github.sha }}

      # Stage 1: boot the template loader headlessly, assert WebGPU pre-init
      # feature detection and the WebGL fallback warning. Loader JS is
      # identical across legs, so run it once on the stock leg.
      - name: Loader smoke test
        if: matrix.leg == 'stock'
        run: |
          cd platform/web
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node ../../misc/webgpu_scripts/loader-smoke.mjs ../../bin

      # Stage 2: call the exported _godot_webgpu_probe() with a software
      # WebGPU adapter and assert the presented clear color on the probe
      # canvas. Skips gracefully when the runner cannot deliver an adapter.
      - name: WebGPU probe smoke test
        if: matrix.leg == 'rd'
        run: |
          cd platform/web
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node ../../misc/webgpu_scripts/loader-smoke.mjs ../../bin probe

      - name: Upload WASM sizes
        uses: actions/upload-artifact@v7
        with:
          name: wasm-sizes-${{ matrix.leg }}-${{ github.sha }}
          path: sizes/

  # Expensive (~1h cold). Disable this job if runner minutes matter; web-template is the required gate.
  linux-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore SCons cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCONS_CACHE }}
          key: linux-editor-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            linux-editor-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev mesa-vulkan-drivers

      - name: Build Linux editor
        run: |
          scons platform=linuxbsd target=editor dev_mode=yes "cache_path=${{ env.SCONS_CACHE }}" redirect_build_objects=no

      # The bake is where SPIR-V becomes WGSL, so it is the only place an
      # upstream shader change shows up as something WebGPU cannot express.
      # Translation failures are not fatal by design - the variant is excluded
      # and the renderer takes another path - so nothing notices unless the
      # exclusions are counted against a baseline. That is this gate.
      - name: Fetch tint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published by the tint-builder workflow; the latest release is that
          # build. Pinning the pattern rather than the tag keeps this working
          # across tint refreshes.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'tint-linux-x86_64' --dir "$RUNNER_TEMP" --clobber
          chmod +x "$RUNNER_TEMP/tint-linux-x86_64"

      - name: Bake the fixture project
        env:
          GODOT_TINT_PATH: ${{ runner.temp }}/tint-linux-x86_64
        run: |
          set -o pipefail
          sudo apt-get install -y xvfb
          EDITOR=$(ls bin/godot.linuxbsd.editor.* | grep -v '\.console' | head -1)
          echo "editor: $EDITOR"
          FIXTURE=misc/webgpu_scripts/bake_fixture

          # Import first so the export is not also the first resource scan.
          "$EDITOR" --headless --path "$FIXTURE" --import || true

          # The shader baker only runs under a real RenderingDevice renderer,
          # so this must NOT be headless: a dummy renderer silently bakes
          # nothing and still reports success. lavapipe (mesa-vulkan-drivers)
          # provides the Vulkan device and xvfb the display.
          xvfb-run -a "$EDITOR" --path "$FIXTURE" \
            --export-pack "Web" "$RUNNER_TEMP/fixture.pck" \
            --rendering-method mobile --rendering-driver vulkan --verbose \
            2>&1 | tee "$RUNNER_TEMP/bake.log"

          test -s "$RUNNER_TEMP/fixture.pck" || { echo "::error::the bake produced no pack"; exit 1; }
          bash misc/webgpu_scripts/check-bake-census.sh "$RUNNER_TEMP/bake.log"

          # The clustered renderer bakes a different (larger) shader family
          # with its own exclusion census; without this leg, an upstream
          # change could break a Forward+ shader and only surface at the next
          # local promotion. Same fixture, renderer flipped for the bake.
          sed -i 's/"mobile"/"forward_plus"/g' "$FIXTURE/project.godot"
          rm -rf "$FIXTURE/.godot/exported" "$FIXTURE/.godot/shader_cache"
          xvfb-run -a "$EDITOR" --path "$FIXTURE" \
            --export-pack "Web" "$RUNNER_TEMP/fixture-fplus.pck" \
            --rendering-method forward_plus --rendering-driver vulkan --verbose \
            2>&1 | tee "$RUNNER_TEMP/bake-fplus.log"

          test -s "$RUNNER_TEMP/fixture-fplus.pck" || { echo "::error::the Forward+ bake produced no pack"; exit 1; }
          bash misc/webgpu_scripts/check-bake-census.sh "$RUNNER_TEMP/bake-fplus.log" \
            misc/webgpu_scripts/bake_fixture/expected-exclusions-forward-plus.txt

      - name: Upload bake logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bake-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bake.log
            ${{ runner.temp }}/bake-fplus.log
          if-no-files-found: ignore

      - name: Save SCons cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ env.SCONS_CACHE }}
          key: linux-editor-${{ runner.os }}-${{ github.sha }}

  check-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream base
        run: |
          git remote add upstream https://github.com/godotengine/godot.git
          git fetch upstream master --depth=200

      - name: Check patch boundaries
        run: bash misc/webgpu_scripts/check-stack.sh
