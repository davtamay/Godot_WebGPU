# Fork-local workflow for the WebGPU patch stack; not intended for upstream.
#
# Builds the tint SPIR-V -> WGSL translator the shader baker shells out to
# (GODOT_TINT_PATH), from the same Dawn tag the emdawnwebgpu port pins, for
# Linux and Windows - and publishes the binaries as permanent release assets
# (tag tint-<ref>). This removes the bus factor of a hand-built local
# tint.exe: any machine (or a future CI bake leg) can fetch a bit-identical
# translator from the repo's releases instead of rebuilding Dawn by hand.
#
# Runs on demand only; re-run with a new dawn_ref when the emdawnwebgpu port
# pin moves (the upstream-sync issue will flag Emscripten pin drift).
#
# The build carries one fork patch: tint's WGSL writer already has an option
# to allow subgroup builtins in non-uniform control flow (Godot's clustered
# light loop needs it), but the command line never exposed it. The step below
# adds --allow-non-uniform-subgroup-operations next to the existing
# --allow-non-uniform-derivatives flag; that binary is what
# GODOT_TINT_PATH_SUBGROUPS points at.

name: WebGPU stack - tint builder

on:
  workflow_dispatch:
    inputs:
      dawn_ref:
        description: "Dawn tag/ref to build tint from"
        required: true
        default: "v20250531.224602"
      release_suffix:
        description: "Appended to the release tag (tint-<ref><suffix>), so a patched build never overwrites a pristine one"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build tint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: out/tint
            asset: tint-linux-x86_64
          - os: windows-latest
            binary: out/Release/tint.exe
            asset: tint-windows-x86_64.exe
    steps:
      - name: Checkout Dawn (GitHub mirror)
        uses: actions/checkout@v4
        with:
          repository: google/dawn
          ref: ${{ github.event.inputs.dawn_ref }}

      - name: Expose the subgroup-uniformity writer option on the command line
        shell: python
        run: |
          import io
          p = "src/tint/cmd/tint/main.cc"
          s = io.open(p, encoding="utf-8").read()
          if "allow-non-uniform-subgroup-operations" in s:
              print("already present"); raise SystemExit
          anchor = "opts->wgsl_writer_options.allow_non_uniform_derivatives = true;\n        }\n    });\n"
          assert s.count(anchor) == 1, "derivatives option block not found - the tint CLI moved, update this step"
          add = anchor + (
              "\n"
              "    auto& allow_nus = options.Add<BoolOption>(\n"
              '        "allow-non-uniform-subgroup-operations",\n'
              '        R"(Allow subgroup builtins in non-uniform control flow by inserting a module-scope directive to\n'
              'suppress any uniformity violations that may be produced)",\n'
              "        Default{false});\n"
              "    TINT_DEFER({\n"
              "        if (allow_nus.value.value_or(false)) {\n"
              "            opts->wgsl_writer_options.allow_non_uniform_subgroup_operations = true;\n"
              "        }\n"
              "    });\n"
          )
          s = s.replace(anchor, add)
          io.open(p, "w", encoding="utf-8", newline="\n").write(s)
          print("patched", p)

      - name: Configure (tint command-line tools only)
        run: >
          cmake -S . -B out
          -DCMAKE_BUILD_TYPE=Release
          -DDAWN_FETCH_DEPENDENCIES=ON
          -DDAWN_ENABLE_D3D11=OFF
          -DDAWN_ENABLE_D3D12=OFF
          -DDAWN_ENABLE_METAL=OFF
          -DDAWN_ENABLE_NULL=OFF
          -DDAWN_ENABLE_DESKTOP_GL=OFF
          -DDAWN_ENABLE_OPENGLES=OFF
          -DDAWN_ENABLE_VULKAN=OFF
          -DDAWN_BUILD_SAMPLES=OFF
          -DDAWN_USE_GLFW=OFF
          -DTINT_BUILD_TESTS=OFF
          -DTINT_BUILD_CMD_TOOLS=ON
          -DTINT_BUILD_SPV_READER=ON
          -DTINT_BUILD_SPV_WRITER=OFF
          -DTINT_BUILD_WGSL_READER=ON
          -DTINT_BUILD_WGSL_WRITER=ON

      - name: Build
        run: cmake --build out --config Release --target tint_cmd_tint_cmd --parallel 4

      - name: Locate and smoke-test the binary
        id: bin
        shell: bash
        run: |
          BIN="${{ matrix.binary }}"
          if [ ! -f "$BIN" ]; then
            # Generator layouts differ; find the tint executable.
            BIN=$(find out -maxdepth 3 -type f \( -name tint -o -name tint.exe \) | head -1)
          fi
          test -n "$BIN" && test -f "$BIN"
          # Functional smoke: round-trip a trivial shader the way the baker
          # invokes tint (this tint has no --version flag).
          printf '@vertex fn m() -> @builtin(position) vec4f { return vec4f(0); }\n' > smoke.wgsl
          "$BIN" --format wgsl smoke.wgsl
          cp "$BIN" "${{ matrix.asset }}"
          echo "asset=${{ matrix.asset }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ steps.bin.outputs.asset }}
          if-no-files-found: error

      - name: Publish as release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tint-${{ github.event.inputs.dawn_ref }}${{ github.event.inputs.release_suffix }}"
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "${{ github.repository }}" \
              --title "tint (Dawn ${{ github.event.inputs.dawn_ref }})" \
              --notes "SPIR-V->WGSL translator built by the tint-builder workflow for the shader baker (GODOT_TINT_PATH). Matches the emdawnwebgpu Dawn pin." || true
          gh release upload "$TAG" -R "${{ github.repository }}" "${{ steps.bin.outputs.asset }}" --clobber
